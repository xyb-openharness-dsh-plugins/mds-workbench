<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小髓宝 MdsPal · 全病程工作台原型 v0.2.1</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="primer.css">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="prototype-bar"><span><b>交互原型 v0.2.1</b> · 全部为合成演示资料</span><span>仅本页演示 · 刷新重置 · 未接入 DSH / AI</span></div>
<div class="workspace">
  <aside class="sidebar" aria-label="小髓宝业务导航">
    <div class="brand"><div class="brand-mark" aria-hidden="true">髓</div><div><strong>小髓宝</strong><span>MdsPal · 慢慢理清楚</span></div></div>
    <button class="profile-btn" data-action="profiles" aria-label="切换演示档案，当前为吴建国">
      <div class="avatar" id="profile-avatar" aria-hidden="true">吴</div>
      <div class="profile-meta"><b id="profile-name">吴建国的资料</b><span id="profile-meta">合成演示 · 档案 A</span></div>
      <span class="profile-caret" aria-hidden="true">⌄</span>
    </button>
    <nav id="nav" aria-label="一级导航"></nav>
    <div class="sidebar-bottom"><span class="eyebrow">小 X 宝家族</span><p>记录可以少一点，<br>陪伴可以久一点。</p><button class="text-button" data-action="help">原型操作说明 ↗</button></div>
  </aside>
  <div class="work-area">
    <header class="topbar">
      <div class="breadcrumb">小髓宝工作台 <span>/</span> <b id="breadcrumb">看板</b></div>
      <div class="top-actions">
        <button class="status" data-action="open-store" aria-label="资料目录：未激活（演示态）"><i class="grey"></i><span>资料目录</span><b>演示态</b></button>
        <button data-action="settings" aria-label="打开设置：工作区目录、文档解析（未接入）、演示档案">设置</button>
        <button id="font-toggle" data-action="font" aria-pressed="false" title="切换大字">大字 Aa</button>
        <!-- 36 号 §3.2：顶栏「?」是疾病概要固定入口，primer.js 接管并补 aria；
             看板首卡另有文字按钮（两处都带 data-primer-open）。 -->
        <button class="icon-button primer-entry" data-primer-open aria-label="疾病概要：骨髓增生异常综合征是什么？定义、医学资料与指南情况、治疗全景、发展趋势" title="疾病概要：定义 · 指南 · 治疗全景 · 趋势">?</button>
        <button class="ver-chip" data-action="about" aria-label="关于小髓宝：查看版本号与构建信息">v0.2.1</button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="footer">小髓宝 · 与患者和照护者一起整理、理解、准备沟通 <span class="ver-line"><b id="app-version">v0.2.1</b><em id="app-build">2026-11-07</em></span></footer>
  </div>
</div>
<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head"><div><span class="eyebrow" id="dialog-eyebrow">小髓宝</span><h2 id="dialog-title"></h2></div><button class="icon-button" data-action="close" aria-label="关闭弹窗">×</button></div>
  <div id="dialog-body" class="dialog-body"></div>
  <div id="dialog-foot" class="dialog-foot"></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="demo-data.js"></script>
<script src="primer-data.js"></script>
<script src="primer.js"></script>
<script src="app.js"></script>
</body></html>
